services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus-course-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-campus-root-local}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/campus?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD:-campus-course-local}
      DEMO_LOGIN: 'true'
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
volumes:
  mysql-data:
